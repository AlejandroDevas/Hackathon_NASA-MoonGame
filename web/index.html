<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Moon Insight 153: lunar landing sites at the south pole, 2026–2030 (NASA Space Apps Challenge 2026)." />
    <meta name="author" content="Israel Alejandro Calvario Mena, Gerardo Andrés Galindo Aparicio, Jessica Betzania Texis Juárez" />
    <title>Moon Insight 153</title>
    <style>
      /* Shown from the first paint, before the bundle and its styles arrive; main.js removes it. */
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; gap: 18px; justify-items: center; padding: 24px; background: #090909; color: #f4f1e9; font: 15px/1.5 system-ui, sans-serif; text-align: center; transition: opacity .35s ease; }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      #splash h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 600; letter-spacing: .01em; }
      #splash p { margin: 0; color: #aaa69b; font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: .04em; }
      #splash .splash-bar { width: min(240px, 60vw); height: 2px; overflow: hidden; background: #393731; }
      #splash .splash-bar::after { content: ''; display: block; width: 40%; height: 100%; background: #d4ad5b; animation: splash-slide 1.4s ease-in-out infinite; }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash .splash-bar::after { animation-duration: 4s; } #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status">
      <h1>Moon Insight 153</h1>
      <div class="splash-bar" aria-hidden="true"></div>
      <p id="splash-text">Cargando…</p>
    </div>
    <div id="scene"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
